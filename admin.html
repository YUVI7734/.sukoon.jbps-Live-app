<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO STUDIO - Ullas 2.0 Admin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');
        
        :root { --bg-color: #05050a; --panel-bg: rgba(15, 15, 25, 0.8); --primary: #00e5ff; --accent: #ff0055; --gold: #ffcc00; --text-main: #e0e0e0; }
        body { margin: 0; padding: 20px; background-color: var(--bg-color); color: var(--text-main); font-family: 'Rajdhani', sans-serif; background-image: radial-gradient(circle at top right, #1a0033 0%, #05050a 60%); background-attachment: fixed; }
        
        #loginScreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { border: 1px solid var(--primary); padding: 40px; text-align: center; background: rgba(0, 229, 255, 0.05); border-radius: 15px; box-shadow: 0 0 30px rgba(0, 229, 255, 0.2); backdrop-filter: blur(10px); }
        .pro-input { background: rgba(0,0,0,0.7); border: 1px solid #333; color: var(--primary); padding: 12px 15px; font-family: inherit; font-size: 16px; font-weight: bold; outline: none; margin: 10px 0; width: 100%; border-radius: 6px; box-sizing: border-box; transition: 0.3s; }
        .pro-input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(0,229,255,0.3); }
        
        .pro-btn { background: linear-gradient(45deg, #00b3cc, var(--primary)); color: #000; border: none; padding: 12px 25px; font-family: 'Orbitron', sans-serif; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase; transition: 0.3s; letter-spacing: 1px; width: 100%; margin-top: 10px; }
        .pro-btn:hover { box-shadow: 0 0 20px var(--primary); transform: translateY(-2px); }
        
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--primary); color: #000; }
        .btn-dj { background: linear-gradient(45deg, #ff9900, var(--gold)); color: #000; margin-bottom: 20px;}
        .btn-dj:hover { box-shadow: 0 0 20px var(--gold); }

        #adminPanel { display: none; max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 1px solid rgba(0,229,255,0.3); padding-bottom: 20px; }
        .header h1 { font-family: 'Orbitron', sans-serif; font-size: 38px; color: #fff; margin: 0; text-shadow: 0 0 20px var(--primary); font-weight: 900; letter-spacing: 2px; }
        
        .grid { display: grid; grid-template-columns: 350px 1fr; gap: 25px; }
        @media(max-width: 800px) { .grid { grid-template-columns: 1fr; } }

        .panel { background: var(--panel-bg); border: 1px solid #222; padding: 25px; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); backdrop-filter: blur(15px); border-top: 4px solid var(--primary); }
        .panel h2 { margin: 0 0 20px 0; font-size: 20px; color: #fff; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 10px; font-family: 'Orbitron', sans-serif; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: var(--primary); font-weight: bold; }
        textarea.pro-input { resize: vertical; height: 80px; }

        .act-list { display: flex; flex-direction: column; gap: 15px; max-height: 400px; overflow-y: auto; padding-right: 5px;}
        .act-list::-webkit-scrollbar { width: 5px; }
        .act-list::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 5px; }

        .act-card { background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 8px; padding: 15px; display: grid; grid-template-columns: 60px 1fr 140px; gap: 15px; align-items: center; transition: 0.3s; }
        .act-card:hover { border-color: var(--primary); background: rgba(0,229,255,0.05); }
        .act-no { font-family: 'Orbitron', sans-serif; font-size: 28px; color: var(--primary); font-weight: bold; text-align: center; border-right: 1px solid #333; padding-right: 15px;}
        .act-info h3 { margin: 0 0 5px 0; font-size: 20px; color: #fff; }
        .act-info p { margin: 0 0 5px 0; font-size: 14px; color: #aaa; }
        .act-notes { font-size: 13px; color: var(--gold); background: rgba(255,204,0,0.1); padding: 5px; border-radius: 4px; border-left: 2px solid var(--gold); margin-top: 5px; }
        .media-badge { display: inline-block; background: #222; color: var(--primary); font-size: 11px; padding: 2px 6px; border-radius: 4px; border: 1px solid #444; margin-right: 5px; margin-top: 5px;}
        .special-badge { display: inline-block; background: rgba(241, 196, 15, 0.2); color: var(--gold); font-size: 11px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--gold); margin-right: 5px; margin-top: 5px; font-weight: bold;}
        
        .act-controls { display: flex; flex-direction: column; gap: 5px; }
        .status-select { background: #111; color: #fff; border: 1px solid #555; padding: 6px; border-radius: 4px; font-family: inherit; font-weight: bold; cursor: pointer; width: 100%;}
        .status-select.live { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px rgba(255,0,85,0.4); }
        
        .timer-box { display: flex; gap: 5px; align-items: center; background: rgba(241,196,15,0.1); padding: 5px; border-radius: 4px; border: 1px dashed var(--gold); }
        
        .btn-group { display: flex; gap: 5px; }
        .btn-sm { flex: 1; background: #222; color: #fff; border: 1px solid #444; padding: 6px; border-radius: 4px; cursor: pointer; font-family: inherit; font-weight: bold; transition: 0.2s; font-size: 12px;}
        .btn-sm:hover { background: #444; }
        .btn-del { flex: 1; background: rgba(255,0,85,0.1); color: var(--accent); border: 1px solid var(--accent); padding: 6px; border-radius: 4px; cursor: pointer; font-family: inherit; font-weight: bold; transition: 0.2s; font-size: 12px;}
        .btn-del:hover { background: var(--accent); color: #fff; }

        .analytics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 25px; }
        .stat-box { background: rgba(0,0,0,0.5); border: 1px solid var(--primary); padding: 20px; border-radius: 10px; text-align: center; }
        .stat-box h3 { margin: 0 0 10px 0; color: #aaa; font-size: 16px; text-transform: uppercase; }
        .stat-box h1 { margin: 0; color: var(--primary); font-size: 40px; font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-box">
            <h2 style="font-family:'Orbitron', sans-serif; margin-top:0;">SECURITY CHECK</h2>
            <input type="password" id="pwdInput" class="pro-input" placeholder="Enter Passcode" style="text-align: center;">
            <button class="pro-btn" onclick="checkAuth()">Access System</button>
            <p id="errorMsg" style="color: var(--accent); display: none; margin-bottom: 0;">Access Denied</p>
        </div>
    </div>

    <div id="adminPanel">
        <div class="header">
            <h1>Welcome YUVI ❤️ 11/11 Ullas 2.0 Admin</h1>
        </div>

        <button class="pro-btn btn-dj" onclick="window.location.href='admin1.html'">🎛️ LAUNCH LIVE DJ CONTROLLER (ADMIN 1) 🎛️</button>
        <button class="pro-btn btn-outline" style="margin-bottom: 20px;" onclick="window.location.href='admin_zones.html'">🌍 LAUNCH ZONAL DECK</button>

        <div class="grid">
            <div class="panel">
                <h2 id="formTitle">Register Act</h2>
                <input type="hidden" id="editMode" value="false">
                
                <div class="form-group">
                    <label>S.No / ID</label>
                    <input type="number" id="actNo" class="pro-input" placeholder="e.g., 1">
                </div>
                <div class="form-group">
                    <label>Act Name</label>
                    <input type="text" id="actName" class="pro-input" placeholder="e.g., Opening Dance">
                </div>
                <div class="form-group">
                    <label>Class/Group</label>
                    <input type="text" id="actClass" class="pro-input" placeholder="e.g., 12-A">
                </div>
                
                <div class="form-group">
                    <label>Thumbnail / DP (For Lobby) *Image Only</label>
                    <input type="file" id="actDP" class="pro-input" accept="image/*" style="padding: 9px;">
                </div>

                <div class="form-group">
                    <label style="color: var(--gold);">⭐ Special Element (Enables 'Join' Button & Timer)</label>
                    <select id="actIsSpecial" class="pro-input" onchange="toggleSpecialMedia()" style="border-color: var(--gold);">
                        <option value="false">No (Normal Performance)</option>
                        <option value="true">Yes (Special Element with Engagement)</option>
                    </select>
                </div>
                
                <div class="form-group" id="specialMediaBox" style="display: none;">
                    <label style="color: var(--gold);">⭐ Upload Special Media (For Light Show Screen)</label>
                    <input type="file" id="actSpecialMedia" class="pro-input" accept="image/*,video/mp4" style="padding: 9px;">
                </div>
                
                <div class="form-group">
                    <label>Director's Notes</label>
                    <textarea id="actNotes" class="pro-input" placeholder="Cue notes, lighting plan..."></textarea>
                </div>
                
                <button class="pro-btn" id="saveBtn" onclick="saveAct()">Save to Admin</button>
                <button class="pro-btn btn-outline" id="cancelBtn" style="display:none;" onclick="resetForm()">Cancel Edit</button>
            </div>

            <div style="display: flex; flex-direction: column; gap: 25px;">
                <div class="panel">
                    <h2>Database & Live Status Controller</h2>
                    <div class="act-list" id="savedActsList">
                        <p style="text-align: center; color: #666;">No performances saved yet.</p>
                    </div>
                </div>

                <!-- NEW: LIVE BROADCAST FEATURE -->
                <div class="panel" style="border-top-color: var(--gold);">
                    <h2 style="color: var(--gold);">🎤 LIVE NOTIFICATION / HANDOVER</h2>
                    <p style="font-size: 13px; color: #aaa; margin-top: -15px;">Send a flash pop-up directly to all parents' phones.</p>
                    <textarea id="broadcastMsg" class="pro-input" placeholder="e.g., Please collect Act 1 students from the reception..." style="height: 60px;"></textarea>
                    <button class="pro-btn" style="background: linear-gradient(45deg, #d4af37, #f1c40f); color: black;" onclick="sendBroadcast()">📢 SEND FLASH POP-UP</button>
                </div>

                <div class="panel">
                    <h2>Live Audience Tracker</h2>
                    <div class="analytics-grid">
                        <div class="stat-box">
                            <h3>Total VIP Pass Clicks</h3>
                            <h1 id="totalTapsCount">0</h1>
                        </div>
                        <div class="stat-box">
                            <h3 style="color: var(--accent);">Live Devices</h3>
                            <h1 id="liveDevicesCount" style="color: var(--accent);">0</h1>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDdluLR3iRPThrHJgl4Ag-3sCUtWqjeNiA",
            authDomain: "jbps-voting-app-64e09.firebaseapp.com",
            databaseURL: "https://jbps-voting-app-64e09-default-rtdb.firebaseio.com",
            projectId: "jbps-voting-app-64e09",
            storageBucket: "jbps-voting-app-64e09.firebasestorage.app",
            messagingSenderId: "21759156292",
            appId: "1:21759156292:web:9387c446af3e5740efdc11"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let loadedActs = {};

        document.getElementById('pwdInput').addEventListener('keypress', function(e) { if(e.key === 'Enter') checkAuth(); });
        function checkAuth() {
            if(document.getElementById('pwdInput').value === "7734") {
                document.getElementById('loginScreen').style.display = "none";
                document.getElementById('adminPanel').style.display = "block";
                loadActs();
                loadAnalytics();
            } else {
                document.getElementById('errorMsg').style.display = "block";
            }
        }

        // NEW: BROADCAST FUNCTION
        function sendBroadcast() {
            const msg = document.getElementById('broadcastMsg').value;
            if(!msg.trim()) return alert("Please type a message first!");
            
            database.ref('ullas_live/announcement').set({
                message: msg,
                timestamp: Date.now()
            });
            alert("Broadcast sent successfully to all live devices!");
            document.getElementById('broadcastMsg').value = "";
        }

        function toggleSpecialMedia() {
            const isSpecial = document.getElementById('actIsSpecial').value === "true";
            document.getElementById('specialMediaBox').style.display = isSpecial ? "block" : "none";
        }

        function getBase64Media(file) {
            return new Promise((resolve) => {
                if(!file) { resolve({ data: "", type: "" }); return; }
                const reader = new FileReader();
                reader.onload = () => resolve({ data: reader.result, type: file.type.includes('video') ? 'video' : 'image' });
                reader.readAsDataURL(file);
            });
        }

        async function saveAct() {
            const no = document.getElementById('actNo').value;
            const name = document.getElementById('actName').value;
            const cls = document.getElementById('actClass').value;
            const notes = document.getElementById('actNotes').value;
            const isSpecial = document.getElementById('actIsSpecial').value === "true";
            
            const dpInput = document.getElementById('actDP').files[0];
            const spInput = document.getElementById('actSpecialMedia').files[0];
            
            const isEdit = document.getElementById('editMode').value === "true";

            if(!no || !name) { alert("S.No and Name are required!"); return; }

            if(spInput && spInput.size > 5 * 1024 * 1024) {
                alert("File size is too large for database sync. Please upload a file smaller than 5MB.");
                return;
            }

            document.getElementById('saveBtn').innerText = "Uploading...";
            document.getElementById('saveBtn').style.opacity = "0.7";

            try {
                let dpPic = "";
                if(dpInput) dpPic = (await getBase64Media(dpInput)).data;
                else if (isEdit && loadedActs[no]) dpPic = loadedActs[no].pic || "";

                let spData = { data: "", type: "" };
                if(isSpecial && spInput) spData = await getBase64Media(spInput);
                else if (isEdit && loadedActs[no] && isSpecial) spData = { data: loadedActs[no].specialMedia || "", type: loadedActs[no].specialMediaType || "" };

                const status = (isEdit && loadedActs[no]) ? loadedActs[no].status : "upcoming";
                const unlockTime = (isEdit && loadedActs[no]) ? (loadedActs[no].unlockTime || 0) : 0;

                const actData = { 
                    no, name, class: cls, notes, status, unlockTime,
                    pic: dpPic,
                    isSpecial: isSpecial, specialMedia: spData.data, specialMediaType: spData.type
                };

                await database.ref('admin_saved_acts/' + no).set(actData);
                resetForm();
            } catch (error) {
                console.error(error);
                alert("Error saving act! The file might be too large.");
                document.getElementById('saveBtn').innerText = "Save to Admin";
                document.getElementById('saveBtn').style.opacity = "1";
            }
        }

        function resetForm() {
            document.getElementById('actNo').value = "";
            document.getElementById('actNo').readOnly = false;
            document.getElementById('actName').value = "";
            document.getElementById('actClass').value = "";
            document.getElementById('actDP').value = "";
            document.getElementById('actSpecialMedia').value = "";
            document.getElementById('actIsSpecial').value = "false";
            document.getElementById('actNotes').value = "";
            document.getElementById('editMode').value = "false";
            document.getElementById('formTitle').innerText = "Register Act";
            document.getElementById('saveBtn').innerText = "Save to Admin";
            document.getElementById('saveBtn').style.opacity = "1";
            document.getElementById('cancelBtn').style.display = "none";
            toggleSpecialMedia();
        }

        function editAct(no) {
            const act = loadedActs[no];
            document.getElementById('actNo').value = act.no;
            document.getElementById('actNo').readOnly = true; 
            document.getElementById('actName').value = act.name;
            document.getElementById('actClass').value = act.class;
            document.getElementById('actNotes').value = act.notes || "";
            document.getElementById('actIsSpecial').value = (act.isSpecial === true || act.isSpecial === "true") ? "true" : "false";
            document.getElementById('editMode').value = "true";
            
            document.getElementById('formTitle').innerText = "Edit Act #" + no;
            document.getElementById('saveBtn').innerText = "Update Act";
            document.getElementById('cancelBtn').style.display = "inline-block";
            toggleSpecialMedia();
            window.scrollTo(0,0);
        }

        function deleteAct(no) {
            if(confirm("Are you sure you want to permanently delete Act #" + no + "?")) {
                database.ref('admin_saved_acts/' + no).remove();
                if(loadedActs[no] && loadedActs[no].status === 'live') {
                    database.ref('current_act').update({ status: 'ended' });
                }
            }
        }

        function applyLock(no) {
            const tInput = document.getElementById('timer_' + no);
            const mins = parseFloat(tInput.value) || 0;
            const unlockTime = mins > 0 ? Date.now() + (mins * 60000) : 0;
            
            database.ref('admin_saved_acts/' + no).update({ unlockTime: unlockTime });
            if (loadedActs[no] && loadedActs[no].status === 'live') {
                database.ref('current_act').update({ unlockTime: unlockTime });
            }
            
            if(mins > 0) alert(`Success! Act #${no} is locked for ${mins} minutes.`);
            else alert(`Lock removed for Act #${no}.`);
        }

        function changeStatus(no, newStatus) {
            let unlockTime = (loadedActs[no] && loadedActs[no].unlockTime) || 0;

            if(newStatus === 'live') {
                const tInput = document.getElementById('timer_' + no);
                if (tInput && tInput.value) {
                    const mins = parseFloat(tInput.value);
                    if (mins > 0) unlockTime = Date.now() + (mins * 60000);
                }
                
                database.ref('admin_saved_acts/' + no).update({ status: 'live', unlockTime: unlockTime });
                let actData = { ...loadedActs[no], status: 'live', unlockTime: unlockTime };
                database.ref('current_act').set(actData);
                database.ref('audience_fx').set({ type: 'normal' });
            } 
            else if (newStatus === 'ended') {
                database.ref('admin_saved_acts/' + no).update({ status: 'ended', unlockTime: 0 });
                database.ref('current_act').once('value', s => {
                    if(s.val() && s.val().no === no) {
                        database.ref('current_act').update({ status: 'ended', unlockTime: 0 });
                        database.ref('audience_fx').set({ type: 'solid', color: '#000000' });
                    }
                });
            } 
            else {
                database.ref('admin_saved_acts/' + no).update({ status: newStatus });
            }
        }

        function loadActs() {
            database.ref('admin_saved_acts').on('value', (snapshot) => {
                loadedActs = snapshot.val() || {};
                const list = document.getElementById('savedActsList');
                list.innerHTML = "";
                
                if(Object.keys(loadedActs).length === 0) {
                    list.innerHTML = "<p style='color:#666; text-align:center;'>No performances saved yet.</p>"; return;
                }

                Object.values(loadedActs).sort((a,b) => parseInt(a.no) - parseInt(b.no)).forEach(act => {
                    const notesHtml = act.notes ? `<div class="act-notes">${act.notes}</div>` : '';
                    const dpBadge = act.pic ? '<span class="media-badge">🖼️ DP</span>' : '';
                    const isSpec = act.isSpecial === true || act.isSpecial === "true";
                    
                    const specialBadge = isSpec ? `<span class="special-badge">⭐ SPECIAL ELEMENT</span>` : '';
                    const isLocked = act.unlockTime && act.unlockTime > Date.now();
                    const lockBadge = isLocked ? `<span style="color: var(--accent); font-size: 11px; font-weight: bold;">🔒 LOCKED</span>` : '';
                    
                    list.innerHTML += `
                        <div class="act-card" style="${isSpec ? 'border-color: var(--gold); background: rgba(241,196,15,0.05);' : ''}">
                            <div class="act-no">${act.no}</div>
                            <div class="act-info">
                                <h3>${act.name} ${lockBadge}</h3>
                                <p>Class: ${act.class}</p>
                                <div style="margin-bottom: 5px;">${dpBadge} ${specialBadge}</div>
                                ${notesHtml}
                            </div>
                            <div class="act-controls">
                                <select class="status-select ${act.status === 'live' ? 'live' : ''}" onchange="changeStatus('${act.no}', this.value)">
                                    <option value="upcoming" ${act.status === 'upcoming' ? 'selected' : ''}>⏳ Coming Soon</option>
                                    <option value="live" ${act.status === 'live' ? 'selected' : ''}>🔴 LIVE NOW</option>
                                    <option value="ended" ${act.status === 'ended' ? 'selected' : ''}>🏁 Ended</option>
                                </select>
                                
                                ${isSpec ? `
                                <div class="timer-box">
                                    <span style="font-size: 14px;">⏱️</span>
                                    <input type="number" id="timer_${act.no}" placeholder="Min" class="pro-input" style="padding: 4px; margin: 0; font-size: 12px; width: 45px; text-align: center;" min="0">
                                    <button class="btn-sm" style="background: var(--gold); color: black; font-weight: bold; padding: 4px 10px;" onclick="applyLock('${act.no}')">LOCK</button>
                                </div>
                                ` : ''}

                                <div class="btn-group">
                                    <button class="btn-sm" onclick="editAct('${act.no}')">✏️ Edit</button>
                                    <button class="btn-del" onclick="deleteAct('${act.no}')">🗑️ Del</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            });
        }

        function loadAnalytics() {
            database.ref('ullas_live/total_taps').on('value', (snapshot) => {
                document.getElementById('totalTapsCount').innerText = snapshot.val() || 0;
            });

            database.ref('ullas_live/active_users').on('value', (snapshot) => {
                const users = snapshot.val() || {};
                const userIds = Object.keys(users);
                const now = Date.now();
                const activeIds = userIds.filter(id => (now - users[id].last_active) < 600000);
                document.getElementById('liveDevicesCount').innerText = activeIds.length;
            });
        }
    </script>
</body>
</html>
