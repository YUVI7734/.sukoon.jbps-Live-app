<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZONAL DJ DECK - Ullas 2.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600&display=swap');
        
        body { margin: 0; padding: 0; background-color: #030305; color: #fff; font-family: 'Rajdhani', sans-serif; overflow-x: hidden; }

        /* --- SLIDE TO UNLOCK SCREEN --- */
        #unlockScreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #1a0033 0%, #000 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s ease;
        }
        #unlockScreen h1 { font-family: 'Orbitron', sans-serif; font-size: 40px; color: #00e5ff; text-shadow: 0 0 20px #00e5ff; margin-bottom: 50px; text-align: center; }
        
        .slider-container {
            width: 300px; height: 60px; background: rgba(255, 255, 255, 0.1); border: 2px solid #00e5ff; border-radius: 40px;
            position: relative; overflow: hidden; box-shadow: inset 0 0 15px rgba(0, 229, 255, 0.2);
        }
        .slider-text {
            position: absolute; width: 100%; height: 100%; line-height: 60px; text-align: center;
            font-size: 16px; color: #888; font-family: 'Orbitron', sans-serif; letter-spacing: 2px; pointer-events: none;
        }
        .slider-thumb {
            width: 60px; height: 60px; background: linear-gradient(45deg, #00e5ff, #0077ff); border-radius: 50%;
            position: absolute; top: 0; left: 0; display: flex; justify-content: center; align-items: center;
            cursor: pointer; font-weight: bold; font-size: 20px; color: #000; box-shadow: 0 0 20px #00e5ff;
            transition: left 0.1s; z-index: 2; touch-action: none;
        }

        /* --- MAIN DASHBOARD --- */
        #mainDashboard { display: none; padding: 20px; max-width: 1400px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #222; padding-bottom: 10px; margin-bottom: 20px; }
        .header h2 { margin: 0; font-family: 'Orbitron', sans-serif; color: #ffcc00; letter-spacing: 2px;}

        .control-panel { background: rgba(20, 20, 30, 0.8); border: 1px solid #333; padding: 20px; border-radius: 12px; margin-bottom: 20px; border-top: 3px solid #ffcc00; }
        .pro-input { background: rgba(0,0,0,0.7); border: 1px solid #555; color: #00e5ff; padding: 10px; font-family: inherit; font-size: 16px; border-radius: 6px; outline: none; margin-right: 10px; }
        .pro-btn { background: #ffcc00; color: #000; border: none; padding: 10px 20px; font-family: 'Orbitron', sans-serif; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .pro-btn:hover { box-shadow: 0 0 15px #ffcc00; }

        /* --- ZONAL DECKS GRID --- */
        #zonesContainer { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        
        .zone-deck { background: #0a0a12; border: 1px solid #444; border-radius: 10px; padding: 15px; position: relative; overflow: hidden; }
        .zone-title { font-family: 'Orbitron', sans-serif; font-size: 18px; color: #fff; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 8px; text-align: center; background: #222; margin: -15px -15px 15px -15px; padding-top: 15px;}
        
        .mini-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .mini-btn { border: none; border-radius: 5px; height: 40px; font-weight: bold; cursor: pointer; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); transition: 0.1s; }
        .mini-btn:active { transform: scale(0.9); }
        
        /* Mini Colors */
        .m-red { background: #ff0033; } .m-blue { background: #0066ff; } .m-green { background: #00e600; color: #000; } .m-gold { background: #ffcc00; color: #000; }
        .m-black { background: #000; border: 1px solid #555; } .m-strobe { background: #fff; color: #000; animation: flash 0.1s infinite; }
        
        /* Master Sync Button */
        .master-sync { width: 100%; background: linear-gradient(90deg, #ff0055, #b300ff); padding: 15px; border-radius: 8px; border: none; color: white; font-family: 'Orbitron'; font-size: 18px; cursor: pointer; margin-bottom: 20px; box-shadow: 0 0 20px rgba(255, 0, 85, 0.4); display: none;}
        .master-sync:active { transform: scale(0.98); }

        @keyframes flash { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(0); background: #000; color: #fff; } }
    </style>
</head>
<body>

    <!-- SLIDE TO UNLOCK SCREEN -->
    <div id="unlockScreen">
        <h1>ZONAL COMMAND<br><span style="font-size: 20px; color: #fff;">ULLAS 2.0</span></h1>
        <div class="slider-container" id="sliderContainer">
            <div class="slider-text">SLIDE TO OPEN</div>
            <div class="slider-thumb" id="sliderThumb">»</div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="mainDashboard">
        <div class="header">
            <h2>🌍 MULTI-ZONE DJ CONTROLLER</h2>
            <button class="pro-btn" style="background: #ff0055; color: white;" onclick="window.location.href='admin.html'">Exit</button>
        </div>

        <div class="control-panel">
            <h3 style="margin-top: 0; color: #00e5ff;">1. Select Performance Setup</h3>
            <select id="actSelector" class="pro-input" style="width: 100%; margin-bottom: 15px;">
                <option value="">-- Load Act from Database --</option>
            </select>

            <h3 style="margin-top: 0; color: #00e5ff;">2. Create Audience Regions</h3>
            <div style="display: flex; align-items: center;">
                <input type="number" id="regionCount" class="pro-input" placeholder="How many zones? (e.g., 2, 3, 4)" min="1" max="6" style="max-width: 250px;">
                <button class="pro-btn" onclick="generateZones()">GENERATE DECKS</button>
            </div>
        </div>

        <button id="masterSyncBtn" class="master-sync" onclick="syncAllZonesBlack()">⬛ MASTER BLACKOUT (ALL ZONES)</button>

        <div id="zonesContainer">
            <!-- Zones will be generated here by JS -->
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script>
        // FIREBASE SETUP
        const firebaseConfig = {
            apiKey: "AIzaSyDdluLR3iRPThrHJgl4Ag-3sCUtWqjeNiA",
            authDomain: "jbps-voting-app-64e09.firebaseapp.com",
            databaseURL: "https://jbps-voting-app-64e09-default-rtdb.firebaseio.com",
            projectId: "jbps-voting-app-64e09",
            storageBucket: "jbps-voting-app-64e09.firebasestorage.app",
            messagingSenderId: "21759156292",
            appId: "1:21759156292:web:9387c446af3e5740efdc11"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // --- SLIDER LOGIC ---
        const thumb = document.getElementById('sliderThumb');
        const container = document.getElementById('sliderContainer');
        let isDragging = false;
        let startX, currentX;

        thumb.addEventListener('mousedown', startDrag);
        thumb.addEventListener('touchstart', startDrag, {passive: false});

        function startDrag(e) {
            isDragging = true;
            startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag, {passive: false});
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchend', stopDrag);
        }

        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            let move = clientX - startX;
            const maxMove = container.offsetWidth - thumb.offsetWidth;

            if (move < 0) move = 0;
            if (move > maxMove) move = maxMove;
            thumb.style.left = move + 'px';

            if (move >= maxMove - 5) { // Unlocked
                isDragging = false;
                document.getElementById('unlockScreen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('unlockScreen').style.display = 'none';
                    document.getElementById('mainDashboard').style.display = 'block';
                    loadActsFromDB();
                }, 500);
            }
        }

        function stopDrag() {
            if (!isDragging) return;
            isDragging = false;
            thumb.style.transition = 'left 0.3s';
            thumb.style.left = '0px';
            setTimeout(() => { thumb.style.transition = 'left 0.1s'; }, 300);
        }

        // --- FIREBASE DATA LOAD ---
        function loadActsFromDB() {
            database.ref('admin_saved_acts').once('value', snap => {
                const acts = snap.val();
                const selector = document.getElementById('actSelector');
                if(acts) {
                    Object.values(acts).sort((a,b) => parseInt(a.no) - parseInt(b.no)).forEach(act => {
                        selector.innerHTML += `<option value="${act.no}">Ch #${act.no}: ${act.name}</option>`;
                    });
                }
            });
        }

        // --- GENERATE REGIONS ---
        function generateZones() {
            const count = parseInt(document.getElementById('regionCount').value);
            const selectedAct = document.getElementById('actSelector').value;
            
            if(!selectedAct) { alert("Please select an act first!"); return; }
            if(!count || count < 1 || count > 6) { alert("Enter valid zones (1-6)"); return; }

            // Save zone count config to firebase so audience devices know how many zones exist
            database.ref('live_zone_config').set({ actNo: selectedAct, totalZones: count });

            const container = document.getElementById('zonesContainer');
            container.innerHTML = "";
            document.getElementById('masterSyncBtn').style.display = "block";

            for(let i = 1; i <= count; i++) {
                const zoneId = `zone_${i}`;
                let zoneName = `Zone ${i}`;
                if(count === 2) zoneName = i === 1 ? "LEFT WING" : "RIGHT WING";
                if(count === 3) zoneName = i === 1 ? "LEFT" : (i === 2 ? "CENTER" : "RIGHT");

                container.innerHTML += `
                    <div class="zone-deck">
                        <h3 class="zone-title">📍 ${zoneName}</h3>
                        
                        <div style="font-size: 12px; color: #888; margin-bottom: 5px;">Solids</div>
                        <div class="mini-grid">
                            <button class="mini-btn m-red" onclick="fireZoneFX('${zoneId}', 'solid', '#ff0033')">RED</button>
                            <button class="mini-btn m-blue" onclick="fireZoneFX('${zoneId}', 'solid', '#0066ff')">BLU</button>
                            <button class="mini-btn m-green" onclick="fireZoneFX('${zoneId}', 'solid', '#00e600')">GRN</button>
                            <button class="mini-btn m-gold" onclick="fireZoneFX('${zoneId}', 'solid', '#ffcc00')">GLD</button>
                        </div>

                        <div style="font-size: 12px; color: #888; margin-bottom: 5px;">Dynamics</div>
                        <div class="mini-grid">
                            <button class="mini-btn m-strobe" onclick="fireZoneFX('${zoneId}', 'strobe', '#ffffff')">⚡ W-STR</button>
                            <button class="mini-btn" style="background: red; animation: flash 0.1s infinite;" onclick="fireZoneFX('${zoneId}', 'strobe', '#ff0033')">⚡ R-STR</button>
                            <button class="mini-btn m-black" onclick="fireZoneFX('${zoneId}', 'normal', '')">🖼️ MEDIA</button>
                            <button class="mini-btn m-black" onclick="fireZoneFX('${zoneId}', 'solid', '#000000')">⬛ OFF</button>
                        </div>
                    </div>
                `;
            }
        }

        // --- FIREBASE CONTROL ---
        function fireZoneFX(zoneId, type, color) {
            database.ref('audience_zones/' + zoneId).set({ type: type, color: color });
        }

        function syncAllZonesBlack() {
            const count = parseInt(document.getElementById('regionCount').value);
            for(let i=1; i<=count; i++) {
                database.ref('audience_zones/zone_' + i).set({ type: 'solid', color: '#000000' });
            }
        }
    </script>
</body>
  </html>
