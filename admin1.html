<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO DJ LAUNCHPAD - Ullas 2.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600&display=swap');
        
        body {
            margin: 0; padding: 15px; background-color: #030305; color: #fff;
            font-family: 'Rajdhani', sans-serif; box-sizing: border-box;
            background-image: radial-gradient(circle at center, #111 0%, #000 100%);
        }
        @media screen and (orientation: portrait) {
            body::before { content: "⚠️ ROTATE TO LANDSCAPE FOR PRO DJ DECK"; display: block; background: #ff0055; color: white; text-align: center; padding: 15px; font-family: 'Orbitron'; margin-bottom: 15px; border-radius: 8px; font-size: 14px;}
        }

        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #222; padding-bottom: 10px; margin-bottom: 15px; }
        .header h2 { margin: 0; font-family: 'Orbitron', sans-serif; color: #00e5ff; letter-spacing: 2px; text-shadow: 0 0 10px #00e5ff;}
        .btn-back { background: transparent; border: 1px solid #ff0055; color: #ff0055; padding: 8px 15px; border-radius: 4px; font-family: inherit; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .btn-back:hover { background: #ff0055; color: #fff; box-shadow: 0 0 15px #ff0055;}
        
        /* 🔥 FORCE BACK BUTTON 🔥 */
        .btn-force-back { background: #ff0055; color: #fff; border: 2px solid #fff; font-weight: 900; cursor: pointer; padding: 12px; width: 100%; font-family: 'Orbitron', sans-serif; font-size: 16px; border-radius: 8px; margin-bottom: 20px; text-transform: uppercase; box-shadow: 0 0 20px rgba(255, 0, 85, 0.6); transition: 0.2s;}
        .btn-force-back:active { transform: scale(0.96); box-shadow: 0 0 10px rgba(255, 0, 85, 0.8); }

        /* Preview */
        .preview-box {
            width: 100%; height: 80px; border: 2px dashed #444; border-radius: 10px; background: #000;
            display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: inset 0 0 20px #000; overflow: hidden; position: relative;
        }
        .preview-box p { margin: 0; font-family: 'Orbitron', sans-serif; color: #fff; opacity: 0.5; font-size: 20px; z-index: 2; text-shadow: 0 0 5px rgba(0,0,0,0.8);}

        /* Grids */
        .section-title { color: #888; font-family: 'Orbitron', sans-serif; font-size: 14px; margin: 0 0 10px 0; letter-spacing: 1px; border-left: 3px solid #00e5ff; padding-left: 10px;}
        .grid-main { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 25px;}
        .grid-colors { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; margin-bottom: 25px;}
        .grid-fx { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 25px;}

        /* Buttons */
        .dj-btn {
            border: none; border-radius: 8px; font-family: 'Orbitron', sans-serif; font-size: 12px;
            cursor: pointer; padding: 20px 5px; transition: 0.1s; text-transform: uppercase;
            box-shadow: inset 0 2px 10px rgba(255,255,255,0.2), 0 5px 15px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
            position: relative; overflow: hidden;
        }
        .dj-btn:active { transform: scale(0.92); box-shadow: none; filter: brightness(1.5); }
        .icon { font-size: 20px; }

        /* Master Utility */
        .c-normal { background: linear-gradient(135deg, #333, #111); color: #fff; border: 1px solid #555; }
        .c-black { background: #000; color: #fff; border: 1px solid #333; }
        .c-jbs-glow { background: #000; color: #ffcc00; border: 1px solid #ffcc00; font-weight: 900;}
        .c-tiranga { background: linear-gradient(to right, #ff9933, #ffffff, #138808); color: #000; border: 1px solid #fff; font-weight: 900;}

        /* Solids */
        .s-red { background: #ff0033; color: #fff; }
        .s-blue { background: #0066ff; color: #fff; }
        .s-green { background: #00e600; color: #000; }
        .s-gold { background: #ffcc00; color: #000; }
        .s-purple { background: #b300ff; color: #fff; }
        .s-cyan { background: #00e5ff; color: #000; }
        .s-neonpink { background: #ff0099; color: #fff; }
        .s-white { background: #ffffff; color: #000; }

        /* Strobes */
        .st-btn { background: #111; border: 2px solid; }
        .st-red { border-color: #ff0033; color: #ff0033; }
        .st-blue { border-color: #0066ff; color: #0066ff; }
        .st-green { border-color: #00e600; color: #00e600; }
        .st-gold { border-color: #ffcc00; color: #ffcc00; }
        .st-purple { border-color: #b300ff; color: #b300ff; }
        .st-cyan { border-color: #00e5ff; color: #00e5ff; }
        .st-neonpink { border-color: #ff0099; color: #ff0099; }
        .st-white { border-color: #ffffff; color: #ffffff; }

        /* Advanced FX */
        .fx-disco { background: linear-gradient(45deg, red, blue, green, yellow); color: #fff; border: 2px solid #fff; animation: multiStrobe 0.2s infinite; }
        .fx-fire { background: #800000; color: #ff9900; border: 2px solid #ff0000; }
        .fx-ocean { background: #001a33; color: #00e5ff; border: 2px solid #0066ff; }
        .fx-toxic { background: #1a3300; color: #33ff00; border: 2px solid #33ff00; }

        /* PREVIEW ANIMATIONS */
        @keyframes flash { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(0); } }
        @keyframes multiStrobe { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
        @keyframes firePulse { 0%, 100% { background: #cc0000; } 50% { background: #ff6600; } }
        @keyframes oceanPulse { 0%, 100% { background: #003366; } 50% { background: #00b3cc; } }
        @keyframes toxicPulse { 0%, 100% { background: #264d00; } 50% { background: #66ff00; } }
        
        @keyframes tirangaCycle {
            0%, 32% { background-color: #ff9933; }
            33%, 65% { background-color: #ffffff; }
            66%, 100% { background-color: #138808; }
        }
        
        @keyframes jbsPulse {
            0%, 100% { filter: drop-shadow(0 0 10px #ffcc00); transform: scale(1); }
            50% { filter: drop-shadow(0 0 35px #ffcc00); transform: scale(1.1); }
        }
    </style>
</head>
<body>
    
    <div class="header">
        <h2>🔴 PRO DJ LAUNCHPAD</h2>
        <button class="btn-back" onclick="window.location.href='admin.html'">Exit</button>
    </div>

    <!-- 🔥 NEW SYSTEM COMMAND BUTTON 🔥 -->
    <button class="btn-force-back" onclick="forceParentsBack()">🚨 Force All Phones to Schedule Page 🚨</button>

    <!-- PREVIEW SCREEN -->
    <div class="preview-box" id="previewScreen">
        <p>AUDIENCE PREVIEW</p>
    </div>

    <!-- MASTER CONTROLS -->
    <h4 class="section-title">Master Overrides & Vibe Checks</h4>
    <div class="grid-main">
        <button class="dj-btn c-normal" onclick="triggerFX('normal', '')">
            <span class="icon">🖼️</span>NORMAL (MEDIA)
        </button>
        <button class="dj-btn c-black" onclick="triggerFX('solid', '#000000')">
            <span class="icon">⬛</span>BLACKOUT
        </button>
        <button class="dj-btn c-jbs-glow" onclick="triggerFX('jbs_glow', '')">
            <span class="icon">✨</span>JBS LOGO GLOW
        </button>
        <button class="dj-btn c-tiranga" onclick="triggerFX('tiranga_cycle', '')">
            <span class="icon">🇮🇳</span>TIRANGA CYCLE
        </button>
    </div>

    <!-- ADVANCED FX -->
    <h4 class="section-title">Advanced Pulsing & Party FX</h4>
    <div class="grid-fx">
        <button class="dj-btn fx-disco" onclick="triggerFX('multi_strobe', '')">
            <span class="icon">🪩</span>DISCO STROBE
        </button>
        <button class="dj-btn fx-fire" onclick="triggerFX('fire_pulse', '')">
            <span class="icon">🔥</span>FIRE PULSE
        </button>
        <button class="dj-btn fx-ocean" onclick="triggerFX('ocean_pulse', '')">
            <span class="icon">🌊</span>OCEAN PULSE
        </button>
        <button class="dj-btn fx-toxic" onclick="triggerFX('toxic_pulse', '')">
            <span class="icon">☣️</span>TOXIC PULSE
        </button>
    </div>

    <!-- SOLID COLORS -->
    <h4 class="section-title">Solid Atmosphere Colors</h4>
    <div class="grid-colors">
        <button class="dj-btn s-red" onclick="triggerFX('solid', '#ff0033')">RED</button>
        <button class="dj-btn s-blue" onclick="triggerFX('solid', '#0066ff')">BLUE</button>
        <button class="dj-btn s-green" onclick="triggerFX('solid', '#00e600')">GREEN</button>
        <button class="dj-btn s-gold" onclick="triggerFX('solid', '#ffcc00')">GOLD</button>
        <button class="dj-btn s-purple" onclick="triggerFX('solid', '#b300ff')">PURPLE</button>
        <button class="dj-btn s-cyan" onclick="triggerFX('solid', '#00e5ff')">CYAN</button>
        <button class="dj-btn s-neonpink" onclick="triggerFX('solid', '#ff0099')">PINK</button>
        <button class="dj-btn s-white" onclick="triggerFX('solid', '#ffffff')">WHITE</button>
    </div>

    <!-- STROBE COLORS -->
    <h4 class="section-title">High Energy Strobes</h4>
    <div class="grid-colors">
        <button class="dj-btn st-btn st-red" onclick="triggerFX('strobe', '#ff0033')">STR RED</button>
        <button class="dj-btn st-btn st-blue" onclick="triggerFX('strobe', '#0066ff')">STR BLUE</button>
        <button class="dj-btn st-btn st-green" onclick="triggerFX('strobe', '#00e600')">STR GRN</button>
        <button class="dj-btn st-btn st-gold" onclick="triggerFX('strobe', '#ffcc00')">STR GOLD</button>
        <button class="dj-btn st-btn st-purple" onclick="triggerFX('strobe', '#b300ff')">STR PURP</button>
        <button class="dj-btn st-btn st-cyan" onclick="triggerFX('strobe', '#00e5ff')">STR CYAN</button>
        <button class="dj-btn st-btn st-neonpink" onclick="triggerFX('strobe', '#ff0099')">STR PNK</button>
        <button class="dj-btn st-btn st-white" onclick="triggerFX('strobe', '#ffffff')">STR WHT</button>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDdluLR3iRPThrHJgl4Ag-3sCUtWqjeNiA",
            authDomain: "jbps-voting-app-64e09.firebaseapp.com",
            databaseURL: "https://jbps-voting-app-64e09-default-rtdb.firebaseio.com",
            projectId: "jbps-voting-app-64e09",
            storageBucket: "jbps-voting-app-64e09.firebasestorage.app",
            messagingSenderId: "21759156292",
            appId: "1:21759156292:web:9387c446af3e5740efdc11"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function triggerFX(type, color) {
            database.ref('audience_fx').set({ type: type, color: color });
        }

        // 🔥 FORCE BACK FUNCTION 🔥
        function forceParentsBack() {
            if(confirm("Are you sure? This will instantly send ALL parents back to the live schedule page.")) {
                database.ref('ullas_live/force_back').set(true);
                // Reset immediately so new users don't get stuck in a loop
                setTimeout(() => {
                    database.ref('ullas_live/force_back').set(false);
                }, 3000);
            }
        }

        // Live Preview Logic for DJ
        database.ref('audience_fx').on('value', (snap) => {
            const fx = snap.val();
            const preview = document.getElementById('previewScreen');
            if(!fx) return;
            
            preview.style.animation = 'none';
            preview.style.backgroundImage = 'none';
            
            if(fx.type === 'normal') {
                preview.style.background = '#222';
                preview.innerHTML = '<p style="color:#00e5ff;">ACT MEDIA IS LIVE</p>';
            } else if (fx.type === 'solid') {
                preview.style.background = fx.color;
                preview.innerHTML = '';
            } else if (fx.type === 'strobe') {
                preview.style.background = fx.color;
                preview.style.animation = 'flash 0.08s infinite';
                preview.innerHTML = '';
            } else if (fx.type === 'jbs_glow') {
                preview.style.background = '#050505';
                preview.innerHTML = '<img src="logo.png" alt="JBS" style="height: 65px; object-fit: contain; animation: jbsPulse 1.5s infinite ease-in-out;">';
            } else if (fx.type === 'tiranga_cycle') {
                preview.style.animation = 'tirangaCycle 3s infinite';
                preview.innerHTML = '<p style="color:#000; text-shadow: 0 0 10px #fff;">TIRANGA CYCLE</p>';
            } else if (fx.type === 'multi_strobe') {
                preview.style.background = 'red'; 
                preview.style.animation = 'multiStrobe 0.2s infinite';
                preview.innerHTML = '<p style="color:#fff;">DISCO STROBE</p>';
            } else if (fx.type === 'fire_pulse') {
                preview.style.animation = 'firePulse 1.5s infinite ease-in-out';
                preview.innerHTML = '<p style="color:#fff;">FIRE PULSE</p>';
            } else if (fx.type === 'ocean_pulse') {
                preview.style.animation = 'oceanPulse 2s infinite ease-in-out';
                preview.innerHTML = '<p style="color:#fff;">OCEAN PULSE</p>';
            } else if (fx.type === 'toxic_pulse') {
                preview.style.animation = 'toxicPulse 1s infinite ease-in-out';
                preview.innerHTML = '<p style="color:#fff;">TOXIC PULSE</p>';
            }
        });
    </script>
</body>
</html>
