<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Light Show - Ullas 2.0</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&family=Yatra+One&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100vh; height: 100dvh;
            overflow: hidden; 
            background-color: #050505;
            color: white; font-family: 'Poppins', sans-serif;
            transition: background 0.1s ease-in-out;
            user-select: none; -webkit-user-select: none;
            touch-action: none;
        }

        /* ---------------------------------------------------
           THE IPHONE (iOS) FIX LAYER
           Yeh layer sabse upar rahegi. Jab DJ strobe chalayega, 
           yeh layer show hogi aur center box / video chhup jayega.
           --------------------------------------------------- */
        #superStrobeLayer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
            z-index: 999999; display: none; pointer-events: none; transition: background-color 0.05s;
        }

        /* Video Player Styling */
        #bgVideo {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
            object-fit: cover; z-index: 1; pointer-events: none; display: none;
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; pointer-events: none; 
        }

        .ullas-watermark {
            font-family: 'Yatra One', serif; font-size: 50px;
            opacity: 0.4; 
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            margin-bottom: 5px;
            color: white;
            transition: opacity 0.3s;
        }

        .act-name {
            font-size: 22px; font-weight: 900; opacity: 0.6;
            letter-spacing: 2px; text-transform: uppercase; text-align: center;
            padding: 0 20px; text-shadow: 0 0 10px rgba(0,0,0,0.8);
            transition: opacity 0.3s;
        }
        
        .zone-badge {
            margin-top: 10px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4);
            padding: 3px 10px; border-radius: 15px; font-size: 11px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase;
            display: none; /* Zone hidden for public view based on previous logic */
        }

        #jbsLogoCenter {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 200px; height: auto; z-index: 5; object-fit: contain; pointer-events: none;
        }

        @keyframes strobeEffect { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(0); background-color: black; } }
        @keyframes multiStrobe { 0% { background-color: red; } 25% { background-color: blue; } 50% { background-color: #33ff00; } 75% { background-color: yellow; } 100% { background-color: red; } }
        @keyframes firePulse { 0%, 100% { background-color: #800000; box-shadow: inset 0 0 50px #ff0000; } 50% { background-color: #ff6600; box-shadow: inset 0 0 100px #ffff00; } }
        @keyframes oceanPulse { 0%, 100% { background-color: #001a33; box-shadow: inset 0 0 50px #0066ff; } 50% { background-color: #00b3cc; box-shadow: inset 0 0 100px #ffffff; } }
        @keyframes toxicPulse { 0%, 100% { background-color: #1a3300; box-shadow: inset 0 0 50px #33ff00; } 50% { background-color: #66ff00; box-shadow: inset 0 0 100px #ffffff; } }
        @keyframes tirangaCycle { 0%, 32% { background-color: #ff9933; } 33%, 65% { background-color: #ffffff; } 66%, 100% { background-color: #138808; } }
        @keyframes jbsPulse { 0%, 100% { filter: drop-shadow(0 0 20px #ffcc00); transform: translate(-50%, -50%) scale(1); } 50% { filter: drop-shadow(0 0 50px #ffcc00); transform: translate(-50%, -50%) scale(1.15); } }

        .particle {
            position: absolute; width: 15px; height: 15px; background: white; border-radius: 50%; pointer-events: none;
            box-shadow: 0 0 15px white, 0 0 30px #f1c40f; animation: fadeOutUp 1s ease-out forwards; z-index: 15;
        }
        @keyframes fadeOutUp { 0% { transform: scale(1) translateY(0); opacity: 1; } 100% { transform: scale(0) translateY(-50px); opacity: 0; } }
    </style>
</head>
<body>

    <!-- STROBE FIX LAYER -->
    <div id="superStrobeLayer"></div>

    <!-- Hidden Video Player for Background -->
    <video id="bgVideo" loop muted playsinline></video>

    <img src="logo.png" id="jbsLogoCenter" alt="JBS">

    <div class="overlay" id="uiOverlay">
        <div id="textOverlay" style="display: flex; flex-direction: column; align-items: center;">
            <div class="ullas-watermark" id="watermark">उल्लास 2.0</div>
            <div class="act-name" id="displayActName">Loading Act...</div>
            <div class="zone-badge" id="zoneDisplay">ZONE</div>
            <p id="touchHint" style="font-size: 13px; opacity: 0.5; margin-top: 50px; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px;">Touch screen to keep awake ✨</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDdluLR3iRPThrHJgl4Ag-3sCUtWqjeNiA",
            authDomain: "jbps-voting-app-64e09.firebaseapp.com",
            databaseURL: "https://jbps-voting-app-64e09-default-rtdb.firebaseio.com",
            projectId: "jbps-voting-app-64e09",
            storageBucket: "jbps-voting-app-64e09.firebasestorage.app",
            messagingSenderId: "21759156292",
            appId: "1:21759156292:web:9387c446af3e5740efdc11"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentBgType = "none";
        let currentBgData = "";
        let wakeLock = null;

        // WakeLock Feature
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    document.getElementById('touchHint').innerText = "Screen lock active 🔒";
                }
            } catch (err) { console.log("WakeLock error:", err); }
        }
        document.body.addEventListener('click', requestWakeLock, { once: true });
        document.body.addEventListener('touchstart', requestWakeLock, { once: true });

        // Act Info Logic
        database.ref('current_act').on('value', (snap) => {
            const act = snap.val();
            if(act && act.status === 'live') {
                document.getElementById('displayActName').innerText = act.name;
                
                if ((act.isSpecial === true || act.isSpecial === "true") && act.specialMedia) {
                    currentBgType = act.specialMediaType || 'image';
                    currentBgData = act.specialMedia;
                } else if (act.mediaData) {
                    currentBgType = act.mediaType || 'image';
                    currentBgData = act.mediaData;
                } else {
                    currentBgType = "none";
                    currentBgData = "";
                }
            } else {
                window.location.href = "engage.html";
            }
        });

        // The Magic FX function (With Strobe Layer Logic)
        function applyFX(fx) {
            if(!fx) return;

            const body = document.body;
            const logo = document.getElementById('jbsLogoCenter');
            const watermark = document.getElementById('watermark');
            const actName = document.getElementById('displayActName');
            const bgVideo = document.getElementById('bgVideo');
            const strobeLayer = document.getElementById('superStrobeLayer');

            // Reset Everything First
            body.style.background = '';
            body.style.backgroundImage = 'none';
            body.style.animation = '';
            body.style.boxShadow = '';
            logo.style.display = 'none';
            logo.style.animation = '';
            watermark.style.opacity = '0.4';
            actName.style.opacity = '0.6';
            strobeLayer.style.display = 'none'; // Turn off strobe layer by default
            strobeLayer.style.animation = '';

            // Pause Video First
            bgVideo.style.display = 'none';
            bgVideo.pause();

            if (fx.type === 'normal') {
                body.style.backgroundColor = '#050505';
                
                if (currentBgType === 'image' && currentBgData) {
                    body.style.backgroundImage = `url(${currentBgData})`;
                    body.style.backgroundSize = 'cover';
                    body.style.backgroundPosition = 'center';
                } 
                else if (currentBgType === 'video' && currentBgData) {
                    if (bgVideo.src !== currentBgData) {
                        bgVideo.src = currentBgData;
                    }
                    bgVideo.style.display = 'block';
                    bgVideo.play().catch(err => console.log("Video Play Error:", err));
                }
            } 
            else if (fx.type === 'solid') { 
                // Fix for iOS solid color
                strobeLayer.style.display = 'block';
                strobeLayer.style.backgroundColor = fx.color;
            } 
            else if (fx.type === 'strobe') { 
                // Fix for iOS Strobe
                strobeLayer.style.display = 'block';
                strobeLayer.style.backgroundColor = fx.color;
                strobeLayer.style.animation = 'strobeEffect 0.08s infinite'; 
            }
            else if (fx.type === 'jbs_glow') {
                body.style.backgroundColor = '#050505';
                logo.style.display = 'block'; logo.style.animation = 'jbsPulse 1.5s infinite ease-in-out';
                watermark.style.opacity = '0'; actName.style.opacity = '0.1';
            }
            else if (fx.type === 'tiranga_cycle') { 
                strobeLayer.style.display = 'block';
                strobeLayer.style.animation = 'tirangaCycle 3s infinite'; 
            }
            else if (fx.type === 'multi_strobe') { 
                strobeLayer.style.display = 'block';
                strobeLayer.style.backgroundColor = 'red'; 
                strobeLayer.style.animation = 'multiStrobe 0.2s infinite'; 
            }
            else if (fx.type === 'fire_pulse') { 
                strobeLayer.style.display = 'block';
                strobeLayer.style.animation = 'firePulse 1.5s infinite ease-in-out'; 
            }
            else if (fx.type === 'ocean_pulse') { 
                strobeLayer.style.display = 'block';
                strobeLayer.style.animation = 'oceanPulse 2s infinite ease-in-out'; 
            }
            else if (fx.type === 'toxic_pulse') { 
                strobeLayer.style.display = 'block';
                strobeLayer.style.animation = 'toxicPulse 1s infinite ease-in-out'; 
            }
        }

        // Zone Handler
        database.ref('live_zone_config/totalZones').on('value', snap => {
            const totalZones = snap.val() || 1;
            let myZone = localStorage.getItem('ullas_user_zone') || 'zone_1';
            
            if (totalZones === 1) {
                myZone = 'zone_1';
                localStorage.setItem('ullas_user_zone', 'zone_1');
            }
            
            database.ref('audience_zones/' + myZone).on('value', (snap) => {
                const fx = snap.val();
                if(fx) applyFX(fx);
            });
        });

        // Master FX Update Logic (Applies the fix functions)
        database.ref('audience_fx').on('value', (snap) => {
            const fx = snap.val();
            applyFX(fx);
        });

        // Touch Particles (Star effects)
        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = (x - 7.5) + 'px'; 
            particle.style.top = (y - 7.5) + 'px';
            document.body.appendChild(particle);
            setTimeout(() => { particle.remove(); }, 1000);
        }
        document.addEventListener('pointermove', (e) => { if(e.buttons > 0) createParticle(e.clientX, e.clientY); });
        document.addEventListener('pointerdown', (e) => { createParticle(e.clientX, e.clientY); });
    </script>
</body>
    </html>
