<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Light Show - Ullas 2.0</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&family=Yatra+One&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100vh; height: 100dvh;
            overflow: hidden; 
            background-color: #000000;
            color: white; font-family: 'Poppins', sans-serif;
            transition: background-color 0.1s ease-in-out, background-image 0.3s ease;
            user-select: none; -webkit-user-select: none; touch-action: none;
        }

        /* 🔴 ULTRA STROBE LAYER (Samsung/OnePlus Color Accuracy Fix) */
        #superStrobeLayer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
            z-index: 999999; display: none; pointer-events: none;
            will-change: background-color;
        }

        /* 🎥 BG Video Player */
        #bgVideo {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
            object-fit: cover; z-index: 1; pointer-events: none; display: none;
        }

        /* 📝 Text Overlay Layout */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; pointer-events: none; 
        }

        #textOverlay {
            display: flex; flex-direction: column; align-items: center;
            transition: opacity 0.5s ease-in-out; /* Smooth Fade In/Out */
            opacity: 1; 
        }

        .ullas-watermark {
            font-family: 'Yatra One', serif; font-size: 50px; opacity: 0.4; 
            text-shadow: 0 0 20px rgba(0,0,0,0.8); margin-bottom: 5px; color: #ffffff;
        }

        .act-name {
            font-size: 22px; font-weight: 900; opacity: 0.6;
            letter-spacing: 2px; text-transform: uppercase; text-align: center;
            padding: 0 20px; text-shadow: 0 0 10px rgba(0,0,0,0.8); color: #ffffff;
        }

        #jbsLogoCenter {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 200px; height: auto; z-index: 5; object-fit: contain; pointer-events: none;
        }

        /* ⚡ Hardware Accelerated Pure Color Keyframes */
        @keyframes strobeEffect { 
            0%, 49% { background-color: var(--strobe-col, #ffffff); } 
            50%, 100% { background-color: #000000; } 
        }
        @keyframes multiStrobe { 0%, 24% { background-color: #ff0000; } 25%, 49% { background-color: #0000ff; } 50%, 74% { background-color: #00ff00; } 75%, 100% { background-color: #ffff00; } }
        @keyframes firePulse { 0%, 100% { background-color: #800000; box-shadow: inset 0 0 50px #ff0000; } 50% { background-color: #ff6600; box-shadow: inset 0 0 100px #ffff00; } }
        @keyframes oceanPulse { 0%, 100% { background-color: #001a33; box-shadow: inset 0 0 50px #0066ff; } 50% { background-color: #00b3cc; box-shadow: inset 0 0 100px #ffffff; } }
        @keyframes toxicPulse { 0%, 100% { background-color: #1a3300; box-shadow: inset 0 0 50px #33ff00; } 50% { background-color: #66ff00; box-shadow: inset 0 0 100px #ffffff; } }
        @keyframes tirangaCycle { 0%, 32% { background-color: #ff9933; } 33%, 65% { background-color: #ffffff; } 66%, 100% { background-color: #138808; } }
        @keyframes jbsPulse { 0%, 100% { filter: drop-shadow(0 0 20px #ffcc00); transform: translate(-50%, -50%) scale(1); } 50% { filter: drop-shadow(0 0 50px #ffcc00); transform: translate(-50%, -50%) scale(1.15); } }

        .particle {
            position: absolute; width: 15px; height: 15px; background: white; border-radius: 50%; pointer-events: none;
            box-shadow: 0 0 15px white, 0 0 30px #f1c40f; animation: fadeOutUp 1s ease-out forwards; z-index: 15;
        }
        @keyframes fadeOutUp { 0% { transform: scale(1) translateY(0); opacity: 1; } 100% { transform: scale(0) translateY(-50px); opacity: 0; } }
    </style>
</head>
<body>

    <!-- OVERLAYS & PLAYERS -->
    <div id="superStrobeLayer"></div>
    <video id="bgVideo" loop muted playsinline preload="auto"></video>
    <img src="logo.png" id="jbsLogoCenter" alt="JBS">

    <div class="overlay" id="uiOverlay">
        <div id="textOverlay">
            <div class="ullas-watermark" id="watermark">उल्लास 2.0</div>
            <div class="act-name" id="displayActName">Loading Act...</div>
            <p id="touchHint" style="font-size: 13px; opacity: 0.5; margin-top: 50px; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px;">Screen lock active 🔒</p>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 🔥 FIREBASE SETUP
        const firebaseConfig = {
            apiKey: "AIzaSyDdluLR3iRPThrHJgl4Ag-3sCUtWqjeNiA",
            authDomain: "jbps-voting-app-64e09.firebaseapp.com",
            databaseURL: "https://jbps-voting-app-64e09-default-rtdb.firebaseio.com",
            projectId: "jbps-voting-app-64e09"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentBgType = "none";
        let currentBgData = "";
        let wakeLock = null;

        // Force WakeLock
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {}
        }
        document.body.addEventListener('click', requestWakeLock, { once: true });
        document.body.addEventListener('touchstart', requestWakeLock, { once: true });

        // 🎛️ CORE FX APPLIER LOGIC
        function applyFX(fx) {
            if(!fx) return;

            const body = document.body;
            const logo = document.getElementById('jbsLogoCenter');
            const textOverlay = document.getElementById('textOverlay');
            const bgVideo = document.getElementById('bgVideo');
            const strobeLayer = document.getElementById('superStrobeLayer');

            // 1. Reset Display Defaults
            body.style.backgroundColor = '#000000';
            body.style.backgroundImage = 'none';
            logo.style.display = 'none';
            logo.style.animation = 'none';
            strobeLayer.style.display = 'none'; 
            strobeLayer.style.animation = 'none';
            
            // 🔥 BROWSER REFLOW HACK (Yeh line strobe ko atkne nahi degi) 🔥
            void strobeLayer.offsetWidth; 
            
            // 2. Pause Video
            bgVideo.style.display = 'none';
            bgVideo.pause();

            let hasMedia = (currentBgType === 'image' && currentBgData) || (currentBgType === 'video' && currentBgData);

            // 3. Apply FX Based on Type
            if (fx.type === 'normal') {
                if (hasMedia) {
                    textOverlay.style.opacity = '0'; // Hide Text instantly when media is there
                    if (currentBgType === 'image') {
                        body.style.backgroundImage = `url(${currentBgData})`;
                        body.style.backgroundSize = 'cover';
                        body.style.backgroundPosition = 'center';
                    } 
                    else if (currentBgType === 'video') {
                        if (bgVideo.src !== currentBgData) bgVideo.src = currentBgData;
                        bgVideo.style.display = 'block';
                        bgVideo.play().catch(e => console.log(e));
                    }
                } else {
                    textOverlay.style.opacity = '1'; // Show text if no media
                }
            } 
            else if (fx.type === 'color' || fx.type === 'solid') {
                textOverlay.style.opacity = '0'; // Hide Text during color payload
                if(fx.color && fx.color !== '#000000') {
                    body.style.backgroundColor = fx.color;
                }
            }
            else if (fx.type === 'strobe') { 
                textOverlay.style.opacity = '0'; // Hide Text during strobe payload
                strobeLayer.style.display = 'block';
                strobeLayer.style.setProperty('--strobe-col', fx.color || '#ffffff');
                strobeLayer.style.animation = 'strobeEffect 0.08s infinite'; 
            }
            // Other Special Effects
            else if (fx.type === 'jbs_glow') {
                textOverlay.style.opacity = '0';
                logo.style.display = 'block'; 
                logo.style.animation = 'jbsPulse 1.5s infinite ease-in-out';
            }
            else if (fx.type === 'tiranga_cycle') { 
                textOverlay.style.opacity = '0';
                strobeLayer.style.display = 'block'; strobeLayer.style.animation = 'tirangaCycle 3s infinite'; 
            }
            else if (fx.type === 'multi_strobe') { 
                textOverlay.style.opacity = '0';
                strobeLayer.style.display = 'block'; strobeLayer.style.animation = 'multiStrobe 0.2s infinite'; 
            }
            else if (fx.type === 'fire_pulse') { 
                textOverlay.style.opacity = '0';
                strobeLayer.style.display = 'block'; strobeLayer.style.animation = 'firePulse 1.5s infinite ease-in-out'; 
            }
            else if (fx.type === 'ocean_pulse') { 
                textOverlay.style.opacity = '0';
                strobeLayer.style.display = 'block'; strobeLayer.style.animation = 'oceanPulse 2s infinite ease-in-out'; 
            }
            else if (fx.type === 'toxic_pulse') { 
                textOverlay.style.opacity = '0';
                strobeLayer.style.display = 'block'; strobeLayer.style.animation = 'toxicPulse 1s infinite ease-in-out'; 
            }
        }

        // 📺 FETCH CURRENT LIVE ACT
        database.ref('current_act').on('value', (snap) => {
            const act = snap.val();
            if(act && act.status === 'live') {
                document.getElementById('displayActName').innerText = act.name;
                
                if ((act.isSpecial === true || act.isSpecial === "true") && act.specialMedia) {
                    currentBgType = act.specialMediaType || 'image';
                    currentBgData = act.specialMedia;
                } else if (act.pic) { 
                    currentBgType = 'image';
                    currentBgData = act.pic;
                } else {
                    currentBgType = "none";
                    currentBgData = "";
                }
                
                // Re-trigger current audience_fx to update background immediately
                database.ref('audience_fx').once('value').then(s => {
                    applyFX(s.val() || {type: 'normal'});
                });
            } else {
                // Return to engage if show ends
                window.location.href = "engaged.html";
            }
        });

        // 🚀 MASTER LISTENER: Strictly listents to audience_fx ONLY
        database.ref('audience_fx').on('value', (snap) => {
            const fx = snap.val() || {type: 'normal'};
            applyFX(fx);
        });

        // 🔥 FORCE BACK TO ENGAGED HTML LISTENER 🔥
        database.ref('ullas_live/force_back').on('value', (snap) => {
            if (snap.val() === true) {
                window.location.href = 'engaged.html';
            }
        });

        // Touch Particles (Star effects)
        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = (x - 7.5) + 'px'; 
            particle.style.top = (y - 7.5) + 'px';
            document.body.appendChild(particle);
            setTimeout(() => { particle.remove(); }, 1000);
        }
        document.addEventListener('pointermove', (e) => { if(e.buttons > 0) createParticle(e.clientX, e.clientY); });
        document.addEventListener('pointerdown', (e) => { createParticle(e.clientX, e.clientY); });
    </script>
</body>
    </html>
